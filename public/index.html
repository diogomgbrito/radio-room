<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio Room</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- Ambient glow -->
  <div class="rr-ambient on"></div>

  <!-- ═══ Join Screen ═══ -->
  <div id="join-screen" class="rr-join">
    <div class="rr-join-card">
      <!-- ON AIR -->
      <div class="rr-onair">
        <div class="rr-onair-mark blinking">
          <img src="./radio-room-onair-mark.svg" alt="On Air" width="24" height="24">
        </div>
        <span class="rr-onair-text blinking-text">On Air</span>
      </div>

      <!-- Logo -->
      <div class="rr-logo">
        <span class="rr-mark">
          <img src="./radio-room-logo-mark.svg" alt="Radio Room" width="32" height="32">
        </span>
        RADIO ROOM
      </div>

      <div class="rr-join-tag">Collaborative listening</div>

      <!-- Name input -->
      <div class="rr-input-wrap">
        <label class="rr-input-label" for="name-input">Your name</label>
        <input type="text" id="name-input" class="rr-input" placeholder="Anonymous" autocomplete="off">
      </div>

      <!-- Join button -->
      <button class="rr-btn" id="join-btn">Enter the room</button>

      <!-- Frequency bar -->
      <div class="rr-frequency">
        <span>FM 87.5</span>
        <span>STEREO</span>
      </div>
    </div>
  </div>

  <!-- ═══ Room View ═══ -->
  <div id="room-view" class="hidden">

    <!-- Top Bar -->
    <div class="rr-topbar">
      <div class="rr-topbar-left">
        <div class="rr-logo-sm">
          <img src="./radio-room-logo-mark.svg" alt="Radio Room" width="20" height="20">
          <span>RADIO ROOM</span>
        </div>
        <div class="rr-divider"></div>
        <div class="rr-onair live">
          <div class="rr-onair-mark blinking">
            <img src="./radio-room-onair-mark.svg" alt="On Air" width="18" height="18">
          </div>
          <span class="rr-onair-text blinking-text">On Air</span>
        </div>
      </div>

      <div class="rr-topbar-right">
        <!-- Volume -->
        <div class="rr-volume">
          <button id="volume-btn" title="Toggle mute">
            <svg id="volume-icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
              <path id="volume-wave1" d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
              <path id="volume-wave2" d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
            </svg>
          </button>
          <input type="range" id="volume-slider" class="rr-slider" min="0" max="100" value="80">
        </div>

        <div class="rr-divider"></div>

        <!-- User chip -->
        <div class="rr-user" id="current-user">
          <div class="rr-user-dot"></div>
          <span id="current-user-name">Anonymous</span>
        </div>

        <div class="rr-divider"></div>

        <!-- Skip -->
        <button class="rr-skip" id="skip-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 4 15 12 5 20 5 4"/>
            <line x1="19" y1="5" x2="19" y2="19"/>
          </svg>
          Skip
          <span class="rr-skip-count" id="skip-count"></span>
        </button>

        <div class="rr-divider"></div>

        <!-- Listeners pill -->
        <div class="rr-listeners-anchor" id="listeners-anchor">
          <button class="rr-listeners-pill" id="listeners-pill">
            <div class="rr-listeners-pulse">
              <span></span><span></span><span></span>
            </div>
            <span class="rr-listeners-num" id="listeners-num">0</span>
            <span class="rr-listeners-lbl">online</span>
          </button>
          <!-- Popover (hidden by default) -->
          <div class="rr-listeners-popover hidden" id="listeners-popover">
            <div class="rr-listeners-popover-head">
              <span>Listeners</span>
              <span class="count" id="popover-count">0</span>
            </div>
            <div class="rr-listeners-popover-list" id="popover-list"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Main Grid -->
    <div class="rr-main">
      <!-- Left Column: Player + Now Playing -->
      <div class="rr-col">
        <!-- Player -->
        <div class="rr-player glowing" id="rr-player">
          <div id="player-container"></div>
          <div class="rr-player-empty" id="player-placeholder">
            <div class="rr-waveform">
              <span></span><span></span><span></span><span></span><span></span>
            </div>
            <div class="rr-empty-text">No track playing</div>
            <div class="rr-empty-sub">Add a song to get started</div>
          </div>
        </div>

        <!-- Progress bar -->
        <div class="rr-progress">
          <div class="rr-progress-bar" id="progress-bar"></div>
        </div>

        <!-- Now Playing -->
        <div class="rr-nowplaying" id="now-playing">
          <div class="rr-vinyl" id="rr-vinyl"></div>
          <div class="rr-now-info">
            <div class="rr-now-label">Now playing</div>
            <div class="rr-now-title" id="np-title">—</div>
            <div class="rr-now-artist" id="np-artist"></div>
            <div class="rr-now-by" id="np-meta"></div>
          </div>
        </div>

        <!-- Add track -->
        <div class="rr-add">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
          <input type="text" id="track-input" placeholder="Paste YouTube or Spotify link...">
          <button class="rr-add-btn" id="add-btn">Add</button>
        </div>
      </div>

      <!-- Right Column: Queue -->
      <div class="rr-col">
        <div class="rr-section-title">
          <span>Up next</span>
          <span class="count" id="queue-count"></span>
        </div>
        <div class="rr-queue" id="queue-list">
          <div class="rr-q-empty">
            <div class="rr-waveform">
              <span></span><span></span><span></span><span></span><span></span>
            </div>
            <div class="rr-empty-text">Queue is empty — add a song</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="./config.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
